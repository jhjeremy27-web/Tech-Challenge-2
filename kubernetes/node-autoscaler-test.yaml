apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-autoscaler-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-autoscaler-test
  template:
    metadata:
      labels:
        app: node-autoscaler-test
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "700m"
              memory: "100Mi"
            limits:
              cpu: "700m"
              memory: "100Mi"