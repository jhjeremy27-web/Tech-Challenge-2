apiVersion: apps/v1
kind: Deployment

metadata:
  name: tech-challenge-2-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tech-challenge-2-app

  template:
    metadata:
      labels:
        app: tech-challenge-2-app

    spec:
      containers:
        - name: tech-challenge-2-app

          image: 234617061592.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-2-app:v1

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"