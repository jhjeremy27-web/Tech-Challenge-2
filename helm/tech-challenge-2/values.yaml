replicaCount: 1

image:
  repository: 234617061592.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-2-app
  tag: "4acc631e4eba160044e4858a805b712348027d7f"
  pullPolicy: IfNotPresent

container:
  port: 5000

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

ingress:
  enabled: true
  className: alb

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50